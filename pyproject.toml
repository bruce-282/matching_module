[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[project]
name = "matching-module"
version = "0.1.0"
description = "Image matching module using Roma model"

authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
maintainers = [
    {name = "Your Name", email = "your.email@example.com"}
]

requires-python = ">=3.9,<3.12"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dynamic = ["dependencies"]

# optional: TEASER++ 는 로컬 경로 의존성이라 절대경로 file:// 를 넣으면
# 외부 resolver(uv/pip)가 extra 미사용 시에도 메타데이터 검증에서 실패할 수 있음.
# 필요 시: pip install ./third_party/TEASER-plusplus  (또는 해당 레포 빌드 안내 따름)
[project.optional-dependencies]
# RoMaV2 가속용 (CUDA fused local correlation kernel, Linux 전용)
fused-local-corr = [
    "fused-local-corr ; sys_platform == 'linux'",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["."]
include = ["matchers*", "datasets*", "third_party*", "utils*"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.pth", "*.ckpt"]

[project.scripts]
roma-match = "core.matchers.roma:main"

# PyTorch CUDA 설치를 위한 post-install 스크립트
[tool.setuptools.cmdclass]
develop = "setuptools.command.develop.develop"
install = "setuptools.command.install.install"


[tool.coverage.run]
source = ["matchers", "utils"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
]

