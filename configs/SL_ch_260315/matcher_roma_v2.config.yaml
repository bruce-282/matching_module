# SL_ch_260315 데이터셋용 RoMaV2 설정 (PLY → 가상 intrinsic 역투영)
model_type: "roma_v2"
roma_v2_setting: "precise"

input_dir: "datasets/SL_ch_260315"
output_dir: "output/SL_ch_260315"

max_keypoints: 5000
geometry_type: "Fundamental"
ransac_method: "CV2_USAC_MAGSAC"
ransac_reproj_threshold: 2.0
ransac_max_iter: 50000
ransac_confidence: 0.99999
debug_mode: true
save_essential: "all"
depth_max: 3000.0
enable_3d_matching: true
pose_estimation_method: "ransac"
result_image_contrast: 1.0
result_image_scale: 2.0
image_undistortion: false

ransac_3d:
  max_correspondence_distance: 1.0
  ransac_n: 5
  max_iterations: 10000
  confidence: 0.99999

image_size:
  width: 1224
  height: 1024

camera_intrinsics:
  fx: 1224
  fy: 1224
  cx: 612
  cy: 512
camera_distortions:
  k1: 0
  k2: 0
  p1: 0
  p2: 0
  k3: 0
