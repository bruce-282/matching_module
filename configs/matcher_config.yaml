# 매칭 설정 파일
# 기본 매칭 설정

# 이미지 경로 설정
source_image_path: "datasets/source6.png"
input_dir: "datasets/autochecker_0909/"
output_dir: "output"

# 매칭 파라미터
max_keypoints: 2000
ransac_method: "CV2_USAC_MAGSAC"
ransac_reproj_threshold: 25.0
ransac_confidence: 0.9999
debug_mode: true

# 포인트 위치 설정 (이미지 비율로 설정)
pointL_pos:
  x_ratio: 0.42
  y_ratio: 0.905

pointR_pos:
  x_ratio: 1.163
  y_ratio: 0.904

pointU_pos:
  x_ratio: 0.781
  y_ratio: 0.5

# 기타 설정
point_radius: 25
depth_max: 2100.0

camera_intrinsics:
  fx: 2344.06988494
  fy: 2344.40009342502
  cx: 989.06314625513
  cy: 807.02989528271
camera_distortions:
  k1: -0.24331290305526787
  k2: 0.13922919417642093
  p1: 0.0005252878633098153
  p2: -0.0010237886757940777
  k3: -0.01443719970450923

image_size:
  width: 2064
  height: 1544
  
image_undistortion: true
