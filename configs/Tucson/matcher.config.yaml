input_dir: "datasets/new_angle/tucson_undistorted/"
output_dir: "new_angle/tucson_undistorted"

max_keypoints: 5000  

geometry_type: "Homography"
ransac_method: "CV2_USAC_MAGSAC"
ransac_reproj_threshold: 13.0  
ransac_max_iter: 30000
ransac_confidence: 0.9999
debug_mode: true

save_essential: "all"  # all, 2d, 3d, none

depth_max: 2500.0

enable_3d_matching: true

stable_depth_range: 50.0 # +-50.0mm

pose_estimation_method: "ransac"  # "svd" 또는 "ransac"

result_image_contrast: 5.0
# 3D RANSAC 파라미터
ransac_3d:
  max_correspondence_distance: 0.8
  ransac_n: 10                         
  max_iterations: 3500                
  confidence: 0.9999

point_radius: 25

camera_intrinsics:
  fx: 2344.06988494
  fy: 2344.40009342502
  cx: 989.06314625513
  cy: 807.02989528271
camera_distortions:
  k1: -0.24331290305526787
  k2: 0.13922919417642093
  p1: 0.0005252878633098153
  p2: -0.0010237886757940777
  k3: -0.01443719970450923

image_size:
  width: 2064
  height: 1544


camera_calibration: [[-0.837413760161382, 0.5378965419296572, 0.09698198014317819,
            1837.131417220074], [-0.3272940313623728, -0.3513913556545883, -0.8771560478077985,
            177.9838240236977], [-0.43774057537192235, -0.7662841674935921, 0.47031028409095144,
            2297.800906280515], [0.0, 0.0, 0.0, 1.0]]

