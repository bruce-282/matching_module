# 서브모듈을 쓰는 경우 shallow clone에서 커밋이 안 맞을 수 있음. romav2는 pip 빌드 시 Git에서 받음.
# fetch-depth: 0 + submodules: recursive 로 CI/릴리스 휠 빌드와 동일하게 맞춘다.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (submodules, full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare tree (idempotent; checkout already fetches submodules)
        run: ./scripts/prepare_build.sh
        env:
          SKIP_SUBMODULES: "1"

      - name: Install build tools
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build
